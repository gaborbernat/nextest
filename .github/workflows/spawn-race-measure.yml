name: spawn race measurement
on:
  push:
    branches: [spawn-race-measure]
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: measure
        shell: bash
        run: |
          echo "cores: $(sysctl -n hw.ncpu 2>/dev/null || nproc)"
          cargo nextest run --no-run -p nextest-runner 2>&1 | tail -1
          for i in $(seq 12); do
            out=$(cargo nextest run -p nextest-runner --no-fail-fast -E "test(concurrent_spawns) & test(absolute)" 2>&1 | grep -o "in round [0-9]*" | sort -u | tr "\n" " ")
            echo "iter $i: ${out:-no-hit}"
          done
