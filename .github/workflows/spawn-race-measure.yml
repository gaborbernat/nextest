name: spawn race measurement
on:
  push:
    branches: [spawn-race-measure]
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - run: ./measure.sh
