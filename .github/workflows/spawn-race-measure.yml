name: spawn race measurement
on:
  push:
    branches: [spawn-race-measure]
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: measure first-hit round with lock disabled
        shell: bash
        run: |
          echo "cores: $(sysctl -n hw.ncpu 2>/dev/null || nproc)"
          cargo nextest run --no-run -p nextest-runner 2>&1 | tail -1
          echo "cases available:"
          cargo nextest list -p nextest-runner -E "test(concurrent_spawns)" 2>/dev/null | tail -6
          for kind in absolute relative; do
            for i in $(seq 10); do
              out=$(timeout 900 cargo nextest run -p nextest-runner --no-fail-fast \
                    -E "test(concurrent_spawns) & test($kind)" 2>&1 || true)
              n=$(echo "$out" | grep -cE "^ *(PASS|FAIL)" || true)
              if echo "$out" | grep -q FAIL; then
                r=$(echo "$out" | grep -oE "in round [0-9]+" | head -1)
                echo "$kind iter $i: HIT ${r:-stall} (cases=$n)"
              else
                echo "$kind iter $i: MISS (cases=$n)"
              fi
            done
          done
